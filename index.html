function geo(s,r){const k=Math.max(r.w/s.img.width,r.h/s.img.height)*s.z,w=s.img.width*k,h=s.img.height*k;
const mx=(w-r.w)/2,my=(h-r.h)/2;s.ox=Math.max(-mx,Math.min(mx,s.ox));s.oy=Math.max(-my,Math.min(my,s.oy));
return{x:r.x+(r.w-w)/2+s.ox,y:r.y+(r.h-h)/2+s.oy,w,h}}
function render(list,guides){ctx.drawImage(poster,0,0,1448,1086);
rects().forEach((r,i)=>{ctx.save();ctx.beginPath();ctx.rect(r.x,r.y,r.w,r.h);ctx.clip();ctx.fillStyle='#fff';ctx.fillRect(r.x,r.y,r.w,r.h);
const s=list[i]||{};if(s.img){const g=geo(s,r);ctx.drawImage(s.img,g.x,g.y,g.w,g.h)}else if(guides){ctx.fillStyle='#999';ctx.font='20px sans-serif';ctx.textAlign='center';ctx.fillText('Foto '+(i+1),r.x+r.w/2,r.y+r.h/2)}
ctx.restore();
if(guides&&mode==2&&i==cur){ctx.strokeStyle='#d33';ctx.lineWidth=3;ctx.strokeRect(r.x+1,r.y+1,r.w-2,r.h-2)}})}
function draw(){render(mode=='b'?[B[cur]]:S,true)}
function pages(){const q=()=>cv.toDataURL('image/jpeg',.95);let o=[];
if(mode=='b')B.forEach(b=>{render([b],false);o.push(q())});else{render(S,false);o.push(q())}draw();return o}
function ui(){const sl=$('slots');sl.innerHTML='';
if(mode=='b'){const l=document.createElement('label');l.className='f';l.innerHTML='Escolher várias fotos<input type="file" accept="image/*" multiple>';
l.querySelector('input').onchange=e=>loadMany([...e.target.files]);sl.append(l);
B.forEach((b,i)=>{const t=document.createElement('img');t.src=b.img.src;t.className='t'+(i==cur?' on':'');t.onclick=()=>{cur=i;ui()};sl.append(t)})}
else for(let i=0;i<mode;i++){const l=document.createElement('label');l.className='f'+(S[i].img?' o':'');
l.innerHTML=(S[i].img?'Trocar foto ':'Enviar foto ')+(mode>1?i+1:'')+'<input type="file" accept="image/*">';
l.querySelector('input').onchange=e=>load(e.target.files[0],i);sl.append(l)}
['1','2','b'].forEach(m=>$('l'+m).classList.toggle('on',String(mode)==m));
$('sel').textContent=mode==2?'Foto selecionada: '+(cur+1):mode=='b'&&B.length?'Cópia '+(cur+1)+' de '+B.length:'';
$('z').value=cs().z||1;draw()}
function load(f,i){if(!f)return;const im=new Image();im.onload=()=>{S[i]={img:im,z:1,ox:0,oy:0};cur=i;ui()};im.src=URL.createObjectURL(f)}
function loadMany(fs){let n=0;fs.forEach(f=>{const im=new Image();im.onload=()=>{B.push({img:im,z:1,ox:0,oy:0});if(++n==fs.length){cur=B.length-fs.length;ui()}};im.src=URL.createObjectURL(f)})}
const setMode=m=>{mode=m;cur=0;ui()};
$('l1').onclick=()=>setMode(1);$('l2').onclick=()=>setMode(2);$('lb').onclick=()=>setMode('b');
$('z').oninput=e=>{if(cs().img){cs().z=+e.target.value;draw()}};
$('rs').onclick=()=>{S[0]={};S[1]={};B.length=0;cur=0;ui()};
let drag=null;
function pt(e){const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*1448/b.width,y:(e.clientY-b.top)*1086/b.height}}
cv.onpointerdown=e=>{const p=pt(e);rects().forEach((r,i)=>{if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h){if(mode==2)cur=i;drag=p;cv.setPointerCapture(e.pointerId);if(mode==2)ui()}})};
cv.onpointermove=e=>{if(!drag||!cs().img)return;const p=pt(e);cs().ox+=p.x-drag.x;cs().oy+=p.y-drag.y;drag=p;draw()};
cv.onpointerup=()=>drag=null;
const none=()=>{const p=pages();if(mode=='b'?!B.length:!S[0].img&&!S[1].img){alert('Envie pelo menos uma foto.');return null}return p};
$('j').onclick=()=>{const p=none();if(p)p.forEach((u,i)=>setTimeout(()=>{const a=document.createElement('a');a.href=u;a.download='madrid-poster-'+(i+1)+'.jpg';a.click()},i*400))};
$('p').onclick=()=>{const p=none();if(!p)return;const{jsPDF}=window.jspdf,d=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
p.forEach((u,i)=>{if(i)d.addPage('a4','landscape');d.addImage(u,'JPEG',0,0,297,210)});d.save('madrid-poster-A4.pdf')};
$('pt').onclick=()=>{const p=none();if(!p)return;const box=$('pr');box.innerHTML='';let n=0;
p.forEach(u=>{const im=new Image();im.onload=()=>{if(++n==p.length)setTimeout(doPrint,100)};im.src=u;box.append(im)})};
function doPrint(){let ok=false;window.addEventListener('beforeprint',()=>ok=true,{once:true});try{window.print()}catch(e){}
setTimeout(()=>{if(ok)return;let m=$('msg');if(!m){m=document.createElement('div');m.id='msg';m.style.cssText='margin-top:10px;font-size:14px';$('pt').parentNode.after(m)}m.innerHTML='A impressão direta não abriu neste ambiente. <button id="pf">Baixar PDF para imprimir</button>';$('pf').onclick=()=>$('p').click()},900)}
poster.onload=ui;
</script></body></html>
